<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Parcelamentos</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F2F1EC; --surface: #FAFAF7; --border: rgba(0,0,0,0.08); --border-md: rgba(0,0,0,0.13);
  --text: #18181A; --text-2: #4A4A52; --text-3: #8A8A95; --ink: #0F0F12;
  --blue: #1847C2; --blue-l: #EBF0FD; --blue-t: #0D35A0;
  --red: #C02828; --red-l: #FCEAEA;
  --r: 10px; --r-sm: 6px; --r-lg: 16px;
  --shadow: 0 1px 2px rgba(0,0,0,0.05), 0 2px 8px rgba(0,0,0,0.04);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100vh;background:var(--bg);font-family:'Instrument Sans',sans-serif;font-size:14px;color:var(--text);}
body{display:flex;align-items:center;justify-content:center;padding:1rem;}

.login-wrap{width:100%;max-width:420px;}
.login-brand{text-align:center;margin-bottom:2rem;}
.login-brand .mark{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;}
.login-brand .name{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;color:var(--ink);line-height:1.1;}
.login-brand .sub{font-size:13px;color:var(--text-3);margin-top:4px;}

.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:2rem;animation:fadeUp 0.3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

.login-card h2{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:0.25rem;}
.login-card p{font-size:13px;color:var(--text-3);margin-bottom:1.5rem;}

.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px;}
.form-row input{width:100%;font-family:'Instrument Sans',sans-serif;font-size:14px;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--border-md);background:var(--bg);color:var(--text);transition:all 0.15s;}
.form-row input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,71,194,0.10);background:var(--surface);}
.form-row input.error{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,40,40,0.08);}

.btn-login{width:100%;padding:11px;border-radius:var(--r-sm);background:var(--blue);color:#fff;font-family:'Instrument Sans',sans-serif;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all 0.15s;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-login:hover{background:#1340AA;transform:translateY(-1px);}
.btn-login:disabled{opacity:0.6;cursor:default;transform:none;}

.error-msg{background:var(--red-l);border:1px solid rgba(192,40,40,0.2);border-radius:var(--r-sm);padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:1rem;display:none;}
.error-msg.show{display:block;}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.login-footer{text-align:center;margin-top:1.25rem;font-size:12px;color:var(--text-3);}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-brand">
    <div class="mark">Sistema de Parcelamentos</div>
    <div class="name">Controle Tributário</div>
    <div class="sub">Gestão de parcelamentos contábeis</div>
  </div>
  <div class="login-card">
    <h2>Entrar na sua conta</h2>
    <p>Use seu e-mail e senha para acessar</p>
    <div class="error-msg" id="error-msg"></div>
    <div class="form-row">
      <label>E-mail</label>
      <input type="email" id="inp-email" placeholder="seu@email.com" autocomplete="email">
    </div>
    <div class="form-row">
      <label>Senha</label>
      <input type="password" id="inp-senha" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" id="btn-login" onclick="fazerLogin()">Entrar</button>
  </div>
  <div class="login-footer">Acesso restrito · Solicite credenciais ao administrador</div>
</div>

<script>
const SUPABASE_URL = 'https://eijacomyyejjooycwbim.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpamFjb215eWVqam9veWN3YmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI3MjcsImV4cCI6MjA5NTU2ODcyN30.BQ8VbNc4AVOAhpkrli6LsZqHNxIVE-2OGbfvgFZMonM';

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.classList.add('show');
}
function hideError() { document.getElementById('error-msg').classList.remove('show'); }

async function fazerLogin() {
  hideError();
  const email = document.getElementById('inp-email').value.trim();
  const senha = document.getElementById('inp-senha').value;
  if (!email || !senha) { showError('Preencha e-mail e senha.'); return; }

  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Entrando…';

  try {
    // Autenticar via Supabase Auth
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: senha })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || 'Credenciais inválidas.');

    // Salvar sessão
    localStorage.setItem('sb_access_token', data.access_token);
    localStorage.setItem('sb_refresh_token', data.refresh_token);
    localStorage.setItem('sb_user_id', data.user.id);

    // Buscar perfil do usuário
    const perfil = await fetch(`${SUPABASE_URL}/rest/v1/perfis?id=eq.${data.user.id}&select=*,empresas(*)`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${data.access_token}` }
    });
    const perfis = await perfil.json();
    if (!perfis.length) throw new Error('Perfil não encontrado. Contate o administrador.');
    if (!perfis[0].ativo) throw new Error('Usuário inativo. Contate o administrador.');

    localStorage.setItem('sb_perfil', JSON.stringify(perfis[0]));
    window.location.href = 'app.html';
  } catch(e) {
    showError(e.message || 'Erro ao fazer login.');
    btn.disabled = false;
    btn.innerHTML = 'Entrar';
  }
}

// Redirecionar se já logado
const token = localStorage.getItem('sb_access_token');
if (token) window.location.href = 'app.html';

document.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });
</script>
</body>
</html>
